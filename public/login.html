<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARDEALS // Connexion Requise</title>
  <!-- Google Fonts for premium gaming styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  
  <div class="login-layout">
    <!-- Animated gaming glowing background shapes -->
    <div class="login-glow glow-1"></div>
    <div class="login-glow glow-2"></div>
    
    <div class="login-card glass-panel" id="loginCard">
      <!-- Logo Area -->
      <div class="login-logo-area">
        <svg class="login-logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Lotus inspired sigil -->
          <path d="M50 5 L90 25 L90 75 L50 95 L10 75 L10 25 Z" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
          <path d="M50 20 L75 45 L65 75 L50 60 L35 75 L25 45 Z" stroke="#cca152" stroke-width="4" fill="rgba(204, 161, 82, 0.1)" stroke-linejoin="round" />
          <polygon points="50,35 60,50 50,65 40,50" fill="#ffffff" />
          <line x1="50" y1="5" x2="50" y2="20" stroke="#ffffff" stroke-width="2" />
          <line x1="50" y1="65" x2="50" y2="95" stroke="#cca152" stroke-width="2" />
        </svg>
        <div class="login-title-group">
          <h1 class="login-title">WARDEALS</h1>
          <p class="login-subtitle">CONSOLE DE SNIPE TACTIQUE</p>
        </div>
      </div>
      
      <!-- Security Warning Info -->
      <div class="security-warning">
        <span class="warning-icon">🛡️</span>
        <span class="warning-text">Accès restreint. Veuillez saisir votre code d'autorisation unique pour déverrouiller la console.</span>
      </div>
      
      <!-- Form entry -->
      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="login-input-group">
          <label for="passcodeField" class="login-label">CODE D'ACCÈS SÉCURISÉ</label>
          <div class="login-input-wrapper">
            <span class="input-icon">🔑</span>
            <input type="password" id="passcodeField" placeholder="Saisir le code d'accès..." required autofocus>
            <button type="button" id="btnToggleMask" class="btn-toggle-mask" title="Afficher/Masquer le code">👁️</button>
          </div>
          <span id="errorMessage" class="login-error-msg">Code incorrect. Veuillez réessayer.</span>
        </div>
        
        <button type="submit" id="btnUnlock" class="btn-unlock-console">
          <span>DÉVERROUILLER LA CONSOLE</span>
          <span class="unlock-arrow">➔</span>
        </button>
      </form>
      
      <div class="login-card-footer">
        <span>WARDEALS // Security Protocol v1.4.0</span>
      </div>
    </div>
  </div>

  <script>
    // Set theme based on local storage
    const savedTheme = localStorage.getItem('wardeals_theme');
    if (savedTheme === 'light') {
      document.body.classList.add('light-theme');
    }

    const loginForm = document.getElementById('loginForm');
    const passcodeField = document.getElementById('passcodeField');
    const loginCard = document.getElementById('loginCard');
    const errorMessage = document.getElementById('errorMessage');
    const btnUnlock = document.getElementById('btnUnlock');
    const btnToggleMask = document.getElementById('btnToggleMask');

    // Toggle mask visibility
    btnToggleMask.addEventListener('click', () => {
      if (passcodeField.type === 'password') {
        passcodeField.type = 'text';
        btnToggleMask.textContent = '🔒';
      } else {
        passcodeField.type = 'password';
        btnToggleMask.textContent = '👁️';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const code = passcodeField.value.trim();
      if (!code) return;

      // Lock button state
      btnUnlock.disabled = true;
      btnUnlock.querySelector('span').textContent = 'VÉRIFICATION...';
      errorMessage.classList.remove('visible');
      loginCard.classList.remove('shake-error');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Success sequence animation
          btnUnlock.classList.add('success');
          btnUnlock.querySelector('span').textContent = 'CONSOLE DÉBLOQUÉE !';
          loginCard.classList.add('fade-success');
          
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          // Error shake sequence
          throw new Error(data.error || 'Authentification échouée');
        }
      } catch (err) {
        passcodeField.value = '';
        passcodeField.focus();
        errorMessage.textContent = err.message || "Code d'authentification incorrect.";
        errorMessage.classList.add('visible');
        
        // Trigger CSs keyframe shake
        setTimeout(() => {
          loginCard.classList.add('shake-error');
        }, 10);
        
        btnUnlock.disabled = false;
        btnUnlock.querySelector('span').textContent = 'DÉVERROUILLER LA CONSOLE';
      }
    });
  </script>
</body>
</html>
